name: Manual Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Increment type: patch, minor, major or pre*'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GIT
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Release
        env:
          INCREMENT: ${{ inputs.increment }}
        run: npx release-it --ci --increment "$INCREMENT"

      # Tags pushed with GITHUB_TOKEN do not trigger another push workflow.
      - name: Trigger publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "v$(node -p "require('./package.json').version")"
